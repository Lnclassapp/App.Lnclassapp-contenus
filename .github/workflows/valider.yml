# Contrôle des leçons (ADR-0134 de l'application, §4.2) : valider.rb vit dans l'application, privée ; il est récupéré à Develop.
# PR : les leçons modifiées de lecons/. Poussée sur main et lancement manuel : toutes les leçons.
# Secret requis : APP_READ_TOKEN (lecture seule sur Lnclassapp/App.Lnclassapp). Absent, le contrôle échoue : il ne passe jamais à vide.
name: valider

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: contenus
          fetch-depth: 0

      - name: Jeton de lecture de l'application
        env:
          APP_READ_TOKEN: ${{ secrets.APP_READ_TOKEN }}
        run: |
          if [ -z "$APP_READ_TOKEN" ]; then
            echo "::error::Secret APP_READ_TOKEN absent : impossible de récupérer valider.rb dans Lnclassapp/App.Lnclassapp."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          repository: Lnclassapp/App.Lnclassapp
          ref: Develop
          token: ${{ secrets.APP_READ_TOKEN }}
          path: app
          sparse-checkout: |
            script/contenus
            app/domain/entities
            .ruby-version
          sparse-checkout-cone-mode: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: app/.ruby-version

      - name: Leçons à contrôler
        id: lecons
        working-directory: contenus
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'lecons/' > ../lecons.txt
          else
            find lecons -name '*.json' | sort > ../lecons.txt
          fi
          # Une leçon hors de lecons/<niveau-série>/<matière>/ ne serait jamais copiée : refusée.
          if grep -vE '^lecons/[^/]+/[^/]+/[^/]+\.json$' ../lecons.txt; then
            echo "::error::Fichier hors de lecons/<niveau-série>/<matière>/<leçon>.json (ci-dessus)."
            exit 1
          fi
          echo "nombre=$(wc -l < ../lecons.txt)" >> "$GITHUB_OUTPUT"

      - name: valider.rb
        if: steps.lecons.outputs.nombre != '0'
        working-directory: contenus
        run: xargs -d '\n' ruby ../app/script/contenus/valider.rb < ../lecons.txt
